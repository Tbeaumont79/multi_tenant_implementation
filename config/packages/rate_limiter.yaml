framework:
    rate_limiter:
        # Used by security.yaml login_throttling on the form firewall.
        login:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        # Used by ApiLoginRateLimitListener on POST /api/login.
        api_login:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
